<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="案内生成">
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --border:#e2e4e8; --text:#1f2430; --sub:#6b7280;
    --accent:#4669b3; --accent-dark:#3753a5; --warn-bg:#fff7e6; --warn-border:#f0c36d;
    --danger:#dc2626; --ok-bg:#eef7ee;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; padding:24px; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    line-height:1.6;
  }
  .wrap{max-width:1100px; margin:0 auto;}
  h1{font-size:20px; margin:0 0 4px;}
  .lead{color:var(--sub); font-size:13px; margin:0 0 20px;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:18px 20px; margin-bottom:18px;}
  .step-title{font-size:14px; font-weight:700; margin:0 0 10px; display:flex; align-items:center; gap:8px;}
  .step-num{background:var(--accent); color:#fff; width:20px; height:20px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:12px; flex-shrink:0;}
  textarea{
    width:100%; min-height:140px; border:1px solid var(--border); border-radius:8px; padding:10px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; resize:vertical;
  }
  .hint{font-size:12px; color:var(--sub); margin:6px 0 12px;}
  button{
    background:var(--accent); color:#fff; border:none; border-radius:7px; padding:9px 16px;
    font-size:13px; font-weight:600; cursor:pointer;
  }
  button:hover{background:var(--accent-dark);}
  button.secondary{background:#fff; color:var(--accent); border:1px solid var(--accent);}
  button.secondary:hover{background:#f0f3f9;}
  button.tiny{padding:3px 8px; font-size:11px; border-radius:5px;}
  button:disabled{background:#c7c9cf; cursor:not-allowed;}
  .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .controls{display:flex; gap:16px; align-items:flex-end; flex-wrap:wrap; margin-bottom:14px;}
  .field{display:flex; flex-direction:column; gap:4px;}
  .field label{font-size:12px; color:var(--sub);}
  .field input[type=number], .field select, .field input[type=text]{
    border:1px solid var(--border); border-radius:6px; padding:7px 9px; font-size:13px;
  }
  .field input[type=number]{width:100px;}
  .field select{width:130px;}
  .tablewrap{overflow-x:auto;}
  table{width:100%; border-collapse:collapse; font-size:12.5px; margin-top:6px; min-width:900px;}
  th{text-align:left; background:#fafbfc; color:var(--sub); font-weight:600; padding:6px 7px; border-bottom:1px solid var(--border); border-right:1px solid #f0f1f3; font-size:11px; white-space:nowrap;}
  td{padding:4px 7px; border-bottom:1px solid #f0f1f3; border-right:1px solid #f0f1f3; vertical-align:middle;}
  th:last-child, td:last-child{border-right:none;}
  td[contenteditable=true]{outline:none; min-width:40px;}
  td[contenteditable=true]:focus{background:#f2f4fa; box-shadow:inset 0 0 0 1px var(--accent);}
  td select, td input[type=text]{width:100%; border:1px solid transparent; border-radius:5px; padding:4px 5px; font-size:12.5px; background:transparent;}
  td select:hover, td input[type=text]:hover{border-color:var(--border);}
  td select:focus, td input[type=text]:focus{outline:none; background:#f2f4fa; border-color:var(--accent);}
  .section-title{font-weight:700; font-size:13px; margin:16px 0 4px; padding-top:10px; border-top:1px dashed var(--border);}
  .section-title:first-child{border-top:none; margin-top:0;}
  .section-title[contenteditable=true]:focus{background:#f2f4fa;}
  .badge{font-size:10px; padding:1px 6px; border-radius:10px; background:#f0f3f9; color:var(--accent-dark); white-space:nowrap;}
  .badge.warn{background:var(--warn-bg); color:#9a6b00; border:1px solid var(--warn-border);}
  .row-excluded{opacity:.35; text-decoration:line-through;}
  .exclude-cell{text-align:center;}
  .notes-box{background:var(--warn-bg); border:1px solid var(--warn-border); border-radius:8px; padding:10px 12px; font-size:12px; margin-top:10px; display:none;}
  .notes-box.show{display:block;}
  .notes-box b{color:#9a6b00;}
  .notes-box ul{margin:6px 0 0; padding-left:18px;}
  #output{
    width:100%; min-height:260px; border:1px solid var(--border); border-radius:8px; padding:12px;
    font-size:13px; white-space:pre-wrap; font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    overflow:hidden; resize:none;
  }
  #outputK{
    width:100%; min-height:260px; border:1px solid var(--border); border-radius:8px; padding:12px;
    font-size:13px; white-space:pre-wrap; font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    overflow:hidden; resize:none;
  }
  .copy-ok{color:#0a8a3f; font-size:12px; margin-left:8px; display:none;}
  .footer-note{font-size:11px; color:var(--sub); margin-top:6px;}
  .empty-state{color:var(--sub); font-size:13px; padding:14px 0;}
  .cat-panel{background:#fafbfc; border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin-bottom:16px;}
  .cat-panel h3{font-size:12.5px; margin:0 0 8px; color:var(--sub); font-weight:700;}
  .cat-row{display:flex; gap:6px; align-items:center; margin-bottom:6px;}
  .cat-row input[type=text]{border:1px solid var(--border); border-radius:5px; padding:5px 7px; font-size:12.5px;}
  .cat-row input.emoji{width:44px; text-align:center;}
  .cat-row input.name{flex:1;}
  .cat-row select{border:1px solid var(--border); border-radius:5px; padding:5px 7px; font-size:12.5px;}
  .cat-row .mini{background:#fff; color:var(--sub); border:1px solid var(--border); border-radius:5px; padding:4px 7px; font-size:11px; cursor:pointer;}
  .cat-row .mini:hover{background:#f0f0f2;}
  .subnote-row{display:flex; gap:6px; align-items:center; margin-bottom:6px;}
  .subnote-row input[type=text]{border:1px solid var(--border); border-radius:5px; padding:5px 7px; font-size:12.5px; flex:1;}
  .subnote-row select{border:1px solid var(--border); border-radius:5px; padding:5px 7px; font-size:12.5px;}

  /* 大カテゴリ／サブカテゴリ注記の行は、はみ出す場合にページ全体でなくこの中だけ横スクロールさせる */
  .cat-scroll{overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .cat-scroll .cat-row, .cat-scroll .subnote-row{width:max-content; min-width:100%;}
  .cat-row input.emoji{flex-shrink:0;}
  .cat-row input.name{flex-shrink:0; width:150px;}
  .cat-row select{flex-shrink:0; width:130px;}
  .cat-row .mini{flex-shrink:0;}
  .subnote-row input[type=text]{flex-shrink:0; width:200px;}
  .subnote-row select{flex-shrink:0; width:130px;}

  .drag-handle{cursor:grab; text-align:center; color:var(--sub); touch-action:none; user-select:none; -webkit-user-select:none; width:22px; font-size:14px;}
  tr.dragging{opacity:.4;}
  tr.drag-over-top td{box-shadow: inset 0 2px 0 0 var(--accent);}
  tr.drag-over-bottom td{box-shadow: inset 0 -2px 0 0 var(--accent);}

  /* iOSのSafariはフォームのfont-sizeが16px未満だとタップ時に自動ズームするため、
     スマホ幅ではすべてのフォーム部品を16px以上にしてズームを防ぐ */
  @media (max-width:700px){
    textarea, input, select, [contenteditable] { font-size:16px !important; }
  }

  .tabs{display:flex; gap:24px; margin-bottom:18px; border-bottom:1px solid var(--border); overflow-x:auto;}
  .tab-btn{
    background:none; border:none; padding:10px 2px; font-size:14px; font-weight:700; color:var(--sub);
    cursor:pointer; border-bottom:2px solid transparent; border-radius:0; white-space:nowrap;
  }
  .tab-btn:hover{background:none; color:var(--text);}
  .tab-btn.active{color:var(--accent); border-bottom-color:var(--accent);}
  .tab-panel{display:none;}
  .tab-panel.active{display:block;}
  .placeholder-note{font-size:12px; color:#9a6b00; background:var(--warn-bg); border:1px solid var(--warn-border); border-radius:8px; padding:10px 12px; margin-bottom:14px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>入荷情報 整理 & 価格調整ツール</h1>

  <div class="tabs">
    <button class="tab-btn active" id="tabBtnIsozaki" type="button" data-tab="isozaki">磯崎案内</button>
    <button class="tab-btn" id="tabBtnKadokura" type="button" data-tab="kadokura">角倉案内</button>
  </div>

  <div class="tab-panel active" id="panel-isozaki">

  <!-- STEP 1 -->
  <div class="card">
    <p class="step-title"><span class="step-num">1</span>Numbersの表を貼り付け</p>
    <textarea id="pasteArea"></textarea>
    <div class="row" style="margin-top:10px;">
      <button id="parseBtn">読み込む</button>
      <button class="secondary" id="clearBtn" type="button">クリア</button>
    </div>
  </div>

  <!-- STEP 2 -->
  <div class="card" id="previewCard" style="display:none;">
    <p class="step-title"><span class="step-num">2</span>カテゴリ分け・内容確認</p>

    <div class="cat-panel">
      <h3>大カテゴリ（出力される順番どおり）</h3>
      <div class="cat-scroll"><div id="catList"></div></div>
      <button class="secondary tiny" id="addCatBtn" type="button">＋ カテゴリ追加</button>
    </div>

    <div class="cat-panel">
      <h3>大カテゴリの下に追加する文章（【】見出しの下に固定表示、任意）</h3>
      <div class="cat-scroll"><div id="subnoteList"></div></div>
      <button class="secondary tiny" id="addSubnoteBtn" type="button">＋ 追加</button>
    </div>

    <div class="notes-box" id="newCatBox" style="background:#f0f3f9; border-color:#c8d2e8;">
      <b style="color:var(--accent-dark);">💡 新しいカテゴリーを検出しました</b>
      <ul id="newCatList" style="list-style:none; padding-left:0; margin:8px 0 0;"></ul>
    </div>
    <div id="previewTable"></div>
    <div class="notes-box" id="notesBox">
      <b>⚠️ 品目として認識できなかった行</b>
      <ul id="notesList"></ul>
    </div>
    <div class="row" style="margin-top:12px;">
      <button class="secondary tiny" id="addItemBtn" type="button">＋ 品目を追加</button>
    </div>
  </div>

  <!-- STEP 3 -->
  <div class="card" id="markupCard" style="display:none;">
    <p class="step-title"><span class="step-num">3</span>価格ルールで一括計算</p>
    <div class="controls">
      <div class="field">
        <label>しきい値（円）</label>
        <input type="number" id="thresholdInput" value="10000" step="100" min="0">
      </div>
      <div class="field">
        <label>しきい値未満の倍率</label>
        <input type="number" id="lowMultInput" value="1.15" step="0.01" min="0">
      </div>
      <div class="field">
        <label>しきい値以上の倍率</label>
        <input type="number" id="highMultInput" value="1.1" step="0.01" min="0">
      </div>
      <div class="field">
        <label>端数処理（切り上げ単位）</label>
        <select id="roundSelect">
          <option value="1">1円単位</option>
          <option value="10">10円単位</option>
          <option value="50">50円単位</option>
          <option value="100" selected>100円単位</option>
        </select>
      </div>
      <div class="field">
        <label>&nbsp;</label>
        <button id="calcBtn">計算</button>
      </div>
    </div>
  </div>

  <!-- STEP 4 -->
  <div class="card" id="outputCard" style="display:none;">
    <p class="step-title"><span class="step-num">4</span>テキスト生成</p>
    <textarea id="output"></textarea>
    <div class="row" style="margin-top:10px;">
      <button class="secondary" id="copyBtn" type="button">コピーする</button>
      <span class="copy-ok" id="copyOk">✔︎ コピーしました</span>
    </div>
  </div>

  </div><!-- /panel-isozaki -->

  <div class="tab-panel" id="panel-kadokura">
    <div class="card">
      <textarea id="pasteAreaK"></textarea>
      <div class="row" style="margin-top:10px;">
        <button id="genBtnK">変換</button>
        <button class="secondary" id="clearBtnK" type="button">クリア</button>
      </div>
    </div>
    <div class="card" id="outputCardK" style="display:none;">
      <div class="row" style="margin-bottom:10px;">
        <button class="secondary" id="copyBtnK" type="button">コピーする</button>
        <span class="copy-ok" id="copyOkK">✔︎ コピーしました</span>
      </div>
      <textarea id="outputK" readonly></textarea>
    </div>
  </div><!-- /panel-kadokura -->

</div>

<script>
(function(){
  const pasteArea = document.getElementById('pasteArea');
  const parseBtn = document.getElementById('parseBtn');
  const clearBtn = document.getElementById('clearBtn');
  const previewCard = document.getElementById('previewCard');
  const previewTable = document.getElementById('previewTable');
  const notesBox = document.getElementById('notesBox');
  const notesList = document.getElementById('notesList');
  const newCatBox = document.getElementById('newCatBox');
  const newCatList = document.getElementById('newCatList');
  const markupCard = document.getElementById('markupCard');
  const outputCard = document.getElementById('outputCard');
  const thresholdInput = document.getElementById('thresholdInput');
  const lowMultInput = document.getElementById('lowMultInput');
  const highMultInput = document.getElementById('highMultInput');
  const roundSelect = document.getElementById('roundSelect');
  const calcBtn = document.getElementById('calcBtn');
  const output = document.getElementById('output');
  const copyBtn = document.getElementById('copyBtn');
  const copyOk = document.getElementById('copyOk');
  const catList = document.getElementById('catList');
  const addCatBtn = document.getElementById('addCatBtn');
  const subnoteList = document.getElementById('subnoteList');
  const addSubnoteBtn = document.getElementById('addSubnoteBtn');
  const addItemBtn = document.getElementById('addItemBtn');

  let allItems = []; // flattened, each item carries dai/naka/tag/name/origin/sizeMain/comment/price/excluded
  let allNotesRaw = [];
  let allPartNotes = []; // 「部位指定は～」等、原文のまま該当カテゴリーの末尾に転記するメモ
  let pendingCategoryDetections = []; // 自動適用した新カテゴリー候補（誤検出時の取り消し用） [{name}]

  let categories = [
    {name:'朝〆鮮魚', emoji:'🐟', style:'line'},
    // 鮮魚は「その他(ナカ無し)」→「神経締め‼️」→「活〆❗️」の順で並べる
    {name:'鮮魚', emoji:'🐡', style:'line', nakaOrder:['', '神経締め‼️', '活〆❗️']},
    {name:'貝・甲殻類', emoji:'🦪', style:'line'},
    {name:'冷凍・加工品', emoji:'🧊', style:'line'},
    {name:'青果', emoji:'🥬', style:'line'},
  ];
  // 新カテゴリー自動判定で見つかったカテゴリーは、既定で「冷凍・加工品」の直前に挿入する
  function insertNewCategory(name, emoji){
    const cat = { name, emoji: emoji || '🐟', style:'line' };
    const idx = categories.findIndex(c=>c.name==='冷凍・加工品');
    if (idx === -1) categories.push(cat); else categories.splice(idx, 0, cat);
  }
  let subnotes = [
    {dai:'朝〆鮮魚', note:'🌀渦巻処理も可能🌀'},
  ];

  const PRICE_RE = {
    k: /^k\s?([\d,]+)$/i,
    yen: /^[¥￥]\s?([\d,]+)$/,
    ask: /^(ASK|問合せ|お問合せ|お問い合わせ)$/i,
    unknown: /^\?+$/,
  };

  function parsePrice(raw){
    const original = (raw||'').trim();
    // 「k700❗️」のように価格の末尾に装飾絵文字・感嘆符が付くことがあるため、
    // 判定はそれらを取り除いた文字列に対して行う（表示用の raw は元のまま残す）
    const s = original.replace(/[\p{Extended_Pictographic}️‍！!‼‽]+$/gu, '').trim();
    if (PRICE_RE.k.test(s)) return {type:'k', value: parseInt(s.match(PRICE_RE.k)[1].replace(/,/g,''),10), raw:original};
    if (PRICE_RE.yen.test(s)) return {type:'yen', value: parseInt(s.match(PRICE_RE.yen)[1].replace(/,/g,''),10), raw:original};
    if (PRICE_RE.ask.test(s)) return {type:'ask', value:null, raw:original};
    if (PRICE_RE.unknown.test(s)) return {type:'unknown', value:null, raw:original};
    if (s === '') return {type:'empty', value:null, raw:original};
    if (/^[\d,]+(\.\d+)?$/.test(s)) return {type:'yen', value: Math.round(parseFloat(s.replace(/,/g,''))), raw:original};
    // 「1尾¥2400」のように前置き文字が付いた価格：¥/kの位置を後方から探して救済し、
    // 前置き部分はコメントとして拾えるよう prefixNote に残す
    let m = s.match(/^(.*?)[¥￥]\s?([\d,]+)$/);
    if (m) return {type:'yen', value: parseInt(m[2].replace(/,/g,''),10), raw:original, prefixNote: m[1].trim()};
    m = s.match(/^(.*?)k\s?([\d,]+)$/i);
    if (m) return {type:'k', value: parseInt(m[2].replace(/,/g,''),10), raw:original, prefixNote: m[1].trim()};
    return {type:'other', value:null, raw:original};
  }

  // 「魚種」「サイズ」「産地」「価格」が横に繰り返し並ぶ見出し行を探し、
  // そこからブロック（4列ひとかたまり）の位置を特定する。
  // Numbersのシートはブロック間に空白列が無いことが多いため、これを最優先の検出方法にする。
  function detectBlocksFromHeader(grid){
    for (let r=0; r<grid.length; r++){
      const row = grid[r];
      const starts = [];
      for (let c=0; c<=row.length-4; c++){
        if (row[c]==='魚種' && row[c+1]==='サイズ' && row[c+2]==='産地' && row[c+3]==='価格'){
          starts.push(c);
        }
      }
      if (starts.length >= 1) return starts.map(s=>[s, s+4]);
    }
    return null;
  }

  function parseGrid(text){
    const lines = text.replace(/\r\n/g,'\n').split('\n').filter(l=>l.trim().length>0);
    const rows = lines.map(l=>l.split('\t'));
    const maxCols = Math.max(...rows.map(r=>r.length), 1);
    const grid = rows.map(r=>{
      const row = r.slice();
      while(row.length < maxCols) row.push('');
      return row.map(c=>(c||'').trim());
    });

    // 1) 見出し行（魚種/サイズ/産地/価格の繰り返し）からブロックを検出
    const headerBlocks = detectBlocksFromHeader(grid);
    if (headerBlocks) return { grid, blocks: headerBlocks };

    // 2) 見出しが見つからない場合は、空白列（すべての行で空）を区切りとして検出
    const blankCols = [];
    for(let c=0;c<maxCols;c++){
      if (grid.every(r=>r[c]==='')) blankCols.push(c);
    }
    let blocks = [];
    let start = 0;
    for(let c=0;c<=maxCols;c++){
      if (blankCols.includes(c) || c===maxCols){
        if (c>start) blocks.push([start,c]);
        start = c+1;
      }
    }
    if (blocks.length===0 && maxCols>0) blocks.push([0,maxCols]);

    // 3) 空白列も無く、1つの塊が4の倍数幅になっている場合は、
    //    区切りが無いだけとみなして4列ずつ機械的に分割する
    if (blocks.length===1){
      const width = blocks[0][1] - blocks[0][0];
      if (width > 4 && width % 4 === 0){
        const s0 = blocks[0][0];
        blocks = [];
        for (let c=s0; c<s0+width; c+=4) blocks.push([c, c+4]);
      }
    }

    return {grid, blocks};
  }

  // ---- text-shaping helpers ----
  function stripEmoji(s){
    // \p{Emoji_Modifier} は🏻等の肌色トーン修飾子。Extended_Pictographicには含まれないため
    // 別途指定しないと、直前の絵文字だけ消えてこれだけ孤立し文字化けして見える不具合があった
    return (s||'').replace(/\p{Extended_Pictographic}|\p{Emoji_Modifier}|\p{Regional_Indicator}|️|‍/gu,'').replace(/\s+/g,' ').trim();
  }

  const FLAG_TO_ORIGIN = {
    '🇳🇴':'ノルウェー', '🇯🇵':'日本', '🇰🇷':'韓国', '🇨🇳':'中国', '🇺🇸':'アメリカ',
    '🇷🇺':'ロシア', '🇨🇱':'チリ', '🇦🇺':'オーストラリア', '🇻🇳':'ベトナム', '🇮🇩':'インドネシア',
  };
  function normalizeOrigin(raw){
    const s = (raw||'').trim();
    return FLAG_TO_ORIGIN[s] || s;
  }

  function splitNameTag(raw){
    // 括弧の前についている装飾絵文字（❄️など）だけ先に除去する。
    // 【】の中の絵文字はタグ抽出時に削除するが、魚種名自体についた絵文字は残す。
    let s = (raw||'').trim().replace(/^[\p{Extended_Pictographic}\p{Regional_Indicator}️‍\s]+/u, '');
    let m = s.match(/^【(.*?)】\s*(.*)$/);
    if (m) return { tag: stripEmoji(m[1]), name: m[2].trim() };
    m = s.match(/^(\S+)\s+(.+)$/);
    if (m) return { tag: stripEmoji(m[1]), name: m[2].trim() };
    return { tag: '', name: s };
  }

  const OK_EMOJI_RE = /[🉑🙆✅👍]/u;
  function splitSizeComment(raw){
    const s = (raw||'').trim();
    if (!s) return { sizeMain:'', comment:'' };
    const tokens = s.split(/\s+/);
    if (tokens.length > 1){
      const lastIdx = tokens.length - 1;
      if (OK_EMOJI_RE.test(tokens[lastIdx])) {
        return { sizeMain: tokens.slice(0, lastIdx).join(' '), comment: tokens[lastIdx] };
      }
      return { sizeMain: s, comment: '' };
    }
    // スペースがない1トークンの場合：数字で始まらない（＝サイズ情報を含まない）なら
    // 丸ごとコメント扱い（例:「バラ売り🉑」）。数字で始まる場合はサイズとして残す。
    if (OK_EMOJI_RE.test(s) && !/^[\d0-9０-９.]/.test(s)) {
      return { sizeMain:'', comment: s };
    }
    return { sizeMain: s, comment: '' };
  }

  function suggestCategory(tag, name){
    const t = tag||'', n = name||'';
    if (/凍結|冷凍|冷|乾燥|干し|燻製|加工/.test(t) || /海苔|燻製|干物/.test(n)) return {dai:'冷凍・加工品', naka:''};
    if (/村産|農園|産直/.test(t) || /メークイン|ダンシャク|きたあかり|テストロイヤー|デストロイヤー|インカ|いも|芋|ねぎ|ネギ|大根|人参|野菜/.test(n)) return {dai:'青果', naka:''};
    // タグに「活貝」「activeカニ」等、貝・カニ・エビ・ウニを示す語がある場合は、
    // 魚種名が個別の品種リストに無くても貝・甲殻類に分類する
    if (/アワビ|サザエ|ホタテ|カキ|牡蠣|ハマグリ|アサリ|シジミ|カニ|蟹|エビ|海老|ロブスター|ウニ/.test(n) || /貝|カニ|蟹|エビ|海老|ウニ/.test(t)) return {dai:'貝・甲殻類', naka:''};
    if (/活魚|渦巻処理/.test(t)) return {dai:'朝〆鮮魚', naka:'養殖活魚🐟神経〆納品📦'};
    // 神経締めは朝〆鮮魚ではなく鮮魚に属する
    if (/江戸前|神経締め|神経〆|神経抜き|脳〆/.test(t)) return {dai:'鮮魚', naka:'神経締め‼️'};
    if (/活〆/.test(t)) return {dai:'鮮魚', naka:'活〆❗️'};
    return {dai:'鮮魚', naka:''};
  }

  // ---- 新カテゴリー自動判定 ----
  // 「価格」列としても「サイズ」列(g・kg等の重量表記)としても認識できない文字列かどうかを判定する。
  // 新カテゴリー見出しの候補行が、実は価格やサイズの書き間違い・列ズレでないことを確認するために使う。
  const WEIGHT_RE = /\d+\s*(g|kg|グラム|キロ|号|サイズ)/i;
  // 「部位指定は～」のような、特定の品目に対する注記。原稿ごとに文言（対象魚種）が変わるため、
  // 固定文を生成するのではなく原文をそのまま抽出し、本文に登場する品目名と突き合わせて配置する
  const PART_NOTE_RE = /部位指定/;
  function looksLikePriceText(s){
    const p = parsePrice(s);
    return p.type==='k' || p.type==='yen' || p.type==='ask' || p.type==='unknown';
  }
  // 行全体から新カテゴリー名と、見出しに使う絵文字を取り出す
  // （【】があればその中身を対象にし、無ければ行全体を対象にする。絵文字はその中の最初の1つを使う）
  function extractCategoryInfoFromLine(raw){
    const s = (raw||'').trim();
    const m = s.match(/^【(.*?)】/);
    const source = m ? m[1] : s;
    const emojiMatch = source.match(/\p{Extended_Pictographic}/u);
    return { name: stripEmoji(source).trim(), emoji: emojiMatch ? emojiMatch[0] : '' };
  }

  function extractItemsFromGrid(grid, blocks){
    const items = [];
    const notes = [];
    const partNotes = []; // 「部位指定は～」等、原文のまま該当品目のカテゴリー末尾に転記するメモ
    const categoryCandidates = []; // 今回の解析で新規に見つかった大カテゴリー候補 [{name}]

    blocks.forEach((range)=>{
      const [s,e] = range;

      // 1st pass: 各行を種別分けする（魚種/サイズ/産地/価格の4列がどう埋まっているか）
      const rows = [];
      for (let r=0; r<grid.length; r++){
        const cells = grid[r].slice(s,e);
        const rawName = cells[0]||'', rawSize = cells[1]||'', origin = cells[2]||'', priceRaw = cells[3]||'';
        if (!rawName && !rawSize && !origin && !priceRaw){ rows.push({type:'blank'}); continue; }
        if (rawName==='魚種' && rawSize==='サイズ'){ rows.push({type:'header'}); continue; } // header row
        const price = parsePrice(priceRaw);
        if (price.type==='k' || price.type==='yen' || price.type==='ask' || price.type==='unknown'){
          rows.push({type:'item', rawName, rawSize, origin, priceRaw, price});
        } else if (rawName && !rawSize && !origin && !priceRaw){
          rows.push({type:'loneName', rawName});
        } else {
          rows.push({type:'partial', rawName, rawSize, origin, priceRaw});
        }
      }

      // 2nd pass: 「名前だけの行」の直後に品目行が続く場合は新カテゴリー見出しとして扱う
      let activeCategory = null; // このブロック内で現在有効なカテゴリー上書き（見出し検出中）
      for (let i=0; i<rows.length; i++){
        const row = rows[i];

        if (row.type === 'loneName'){
          const isCandidate = !looksLikePriceText(row.rawName) && !WEIGHT_RE.test(row.rawName);
          let followedByItem = false;
          if (isCandidate){
            let j = i+1;
            while (rows[j] && rows[j].type==='blank') j++;
            followedByItem = !!(rows[j] && rows[j].type==='item');
          }
          if (isCandidate && followedByItem){
            const { name: catName, emoji: catEmoji } = extractCategoryInfoFromLine(row.rawName);
            const alreadyKnown = categories.some(c=>c.name===catName);
            activeCategory = { name: catName, pending: !alreadyKnown };
            if (!alreadyKnown) categoryCandidates.push({ name: catName, emoji: catEmoji });
          } else if (PART_NOTE_RE.test(row.rawName)){
            partNotes.push(row.rawName.trim());
          } else {
            // 品目としてもカテゴリー見出しとしても認識できない行
            notes.push(row.rawName);
          }
          continue;
        }

        if (row.type === 'partial'){
          notes.push([row.rawName,row.rawSize,row.origin,row.priceRaw].filter(Boolean).join(' / '));
          continue;
        }

        if (row.type === 'item'){
          const {tag, name} = splitNameTag(row.rawName);
          let {sizeMain, comment} = splitSizeComment(row.rawSize);
          if (row.price.prefixNote) sizeMain = sizeMain ? `${sizeMain} ${row.price.prefixNote}` : row.price.prefixNote;
          let dai, naka, newCategoryPending;
          if (activeCategory){
            dai = activeCategory.name; naka = '';
            if (activeCategory.pending) newCategoryPending = activeCategory.name;
          } else {
            const cat = suggestCategory(tag, name);
            dai = cat.dai; naka = cat.naka;
          }
          items.push({
            tag, name, origin: normalizeOrigin(row.origin), sizeMain, comment,
            price: Object.assign({}, row.price, {newValue:null}),
            dai, naka,
            excluded:false,
            newCategoryPending
          });
        }
      }
    });
    return {items, notes, partNotes, categoryCandidates};
  }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ---- category / subnote panel rendering ----
  function renderCatPanel(){
    catList.innerHTML = '';
    categories.forEach((cat, ci)=>{
      const row = document.createElement('div');
      row.className = 'cat-row';
      row.innerHTML = `
        <input type="text" class="emoji" value="${escapeHtml(cat.emoji)}" data-ci="${ci}" data-field="emoji">
        <input type="text" class="name" value="${escapeHtml(cat.name)}" data-ci="${ci}" data-field="name">
        <select data-ci="${ci}" data-field="style">
          <option value="line" ${cat.style==='line'?'selected':''}>ーー見出しーー</option>
          <option value="bracket" ${cat.style==='bracket'?'selected':''}>【見出し】</option>
        </select>
        <button class="mini" data-act="up" data-ci="${ci}" type="button">↑</button>
        <button class="mini" data-act="down" data-ci="${ci}" type="button">↓</button>
        <button class="mini" data-act="del" data-ci="${ci}" type="button">削除</button>
      `;
      catList.appendChild(row);
    });
    catList.querySelectorAll('input,select').forEach(el=>{
      el.addEventListener('input', ()=>{
        const ci = +el.dataset.ci, field = el.dataset.field;
        const oldName = categories[ci].name;
        categories[ci][field] = el.value;
        if (field==='name'){
          allItems.forEach(it=>{ if (it.dai===oldName) it.dai = el.value; });
          subnotes.forEach(sn=>{ if (sn.dai===oldName) sn.dai = el.value; });
        }
      });
      el.addEventListener('change', ()=>{ if (allItems.length) renderPreview(); renderSubnotePanel(); refreshOutputIfVisible(); });
    });
    catList.querySelectorAll('button.mini').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const ci = +btn.dataset.ci, act = btn.dataset.act;
        if (act==='del'){
          if (categories.length<=1) { alert('カテゴリは最低1つ必要です。'); return; }
          categories.splice(ci,1);
        } else if (act==='up' && ci>0){
          [categories[ci-1], categories[ci]] = [categories[ci], categories[ci-1]];
        } else if (act==='down' && ci<categories.length-1){
          [categories[ci+1], categories[ci]] = [categories[ci], categories[ci+1]];
        }
        renderCatPanel();
        renderSubnotePanel();
        if (allItems.length) renderPreview();
        refreshOutputIfVisible();
      });
    });
  }

  // ---- 品目の並べ替え（ドラッグ＆ドロップ） ----
  function moveItemInArray(arr, fromIndex, toIndex){
    const copy = arr.slice();
    const [moved] = copy.splice(fromIndex, 1);
    let insertAt = toIndex;
    if (fromIndex < toIndex) insertAt -= 1;
    copy.splice(insertAt, 0, moved);
    return copy;
  }

  let dragState = null;
  function attachRowDragHandlers(tbody){
    tbody.querySelectorAll('.drag-handle').forEach(handle=>{
      handle.addEventListener('pointerdown', (e)=>{
        e.preventDefault();
        const tr = handle.closest('tr');
        dragState = { fromIndex: +tr.dataset.i, tr, overRow:null, insertBefore:true };
        tr.classList.add('dragging');
        try{ handle.setPointerCapture(e.pointerId); }catch(err){}
      });
    });
  }

  document.addEventListener('pointermove', (e)=>{
    if (!dragState) return;
    const tbody = dragState.tr.parentElement;
    if (!tbody) return;
    const rows = [...tbody.querySelectorAll('tr')];
    rows.forEach(r=>r.classList.remove('drag-over-top','drag-over-bottom'));
    const overRow = rows.find(r=>{
      const rect = r.getBoundingClientRect();
      return e.clientY >= rect.top && e.clientY <= rect.bottom;
    });
    if (overRow && overRow !== dragState.tr){
      const rect = overRow.getBoundingClientRect();
      const insertBefore = e.clientY < rect.top + rect.height/2;
      overRow.classList.add(insertBefore ? 'drag-over-top' : 'drag-over-bottom');
      dragState.overRow = overRow;
      dragState.insertBefore = insertBefore;
    } else {
      dragState.overRow = null;
    }
  });

  document.addEventListener('pointerup', ()=>{
    if (!dragState) return;
    const { fromIndex, overRow, insertBefore, tr } = dragState;
    tr.classList.remove('dragging');
    document.querySelectorAll('.drag-over-top,.drag-over-bottom').forEach(r=>r.classList.remove('drag-over-top','drag-over-bottom'));
    if (overRow){
      const toIndex = +overRow.dataset.i + (insertBefore ? 0 : 1);
      allItems = moveItemInArray(allItems, fromIndex, toIndex);
      renderPreview();
    }
    dragState = null;
  });

  // ---- preview table ----
  function renderPreview(){
    previewTable.innerHTML = '';
    if (allItems.length===0){
      previewTable.innerHTML = '<div class="empty-state">（品目なし）</div>';
    } else {

      table.innerHTML = '<thead><tr><th></th><th>✓</th><th>大カテゴリ</th><th>中カテゴリ</th><th>タグ</th><th>魚種</th><th>産地</th><th>サイズ</th><th>コメント(→)</th><th>価格</th></tr></thead>';
      const tbody = document.createElement('tbody');

        const tr = document.createElement('tr');

        let catOpts = catOptionsHtml;
        if (!categories.some(c=>c.name===it.dai)) {
          catOpts = `<option value="${escapeHtml(it.dai)}" selected>${escapeHtml(it.dai)}（未登録）</option>` + catOpts;
        }
        tr.innerHTML = `
          <td class="drag-handle" data-i="${i}">⠿</td>
          <td class="exclude-cell"><input type="checkbox" ${it.excluded?'':'checked'} data-i="${i}" class="excl-cb"></td>
          <td><select data-field="dai" data-i="${i}">${catOpts}</select></td>
          <td><input type="text" data-field="naka" data-i="${i}" value="${escapeHtml(it.naka)}" list="nakaOptions" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" name="naka-${i}"></td>
          <td contenteditable="true" data-field="tag" data-i="${i}">${escapeHtml(it.tag)}</td>
          <td contenteditable="true" data-field="name" data-i="${i}">${escapeHtml(it.name)}</td>
          <td contenteditable="true" data-field="origin" data-i="${i}">${escapeHtml(it.origin)}</td>
          <td contenteditable="true" data-field="sizeMain" data-i="${i}">${escapeHtml(it.sizeMain)}</td>
          <td contenteditable="true" data-field="comment" data-i="${i}">${escapeHtml(it.comment)}</td>
          <td contenteditable="true" data-field="priceRaw" data-i="${i}">${escapeHtml(it.price.raw)}${warn}</td>
        `;
        tr.querySelector('select[data-field=dai]').value = it.dai;
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      wrap.appendChild(table);
      previewTable.appendChild(wrap);

      // datalist for naka suggestions
      let dl = document.getElementById('nakaOptions');
      if (!dl){ dl = document.createElement('datalist'); dl.id = 'nakaOptions'; previewTable.appendChild(dl); }
      const nakaSet = new Set(subnotes.map(sn=>sn.naka).filter(Boolean));
      allItems.forEach(it=>{ if (it.naka) nakaSet.add(it.naka); });
      dl.innerHTML = Array.from(nakaSet).map(n=>`<option value="${escapeHtml(n)}">`).join('');

      attachRowDragHandlers(tbody);
    }

    previewTable.querySelectorAll('td[contenteditable=true]').forEach(td=>{
      td.addEventListener('input', ()=>{
        const i = +td.dataset.i, field = td.dataset.field;
        const val = td.textContent.trim();
        if (field==='priceRaw'){
          allItems[i].price = Object.assign({}, parsePrice(val), {newValue:null});
        } else {
          allItems[i][field] = val;
        }
        refreshOutputIfVisible();
      });
    });
    previewTable.querySelectorAll('select[data-field=dai]').forEach(sel=>{
      sel.addEventListener('change', ()=>{ allItems[+sel.dataset.i].dai = sel.value; refreshOutputIfVisible(); });
    });
    previewTable.querySelectorAll('input[data-field=naka]').forEach(inp=>{
      inp.addEventListener('input', ()=>{ allItems[+inp.dataset.i].naka = inp.value.trim(); refreshOutputIfVisible(); });
    });
    previewTable.querySelectorAll('.excl-cb').forEach(cb=>{
      cb.addEventListener('change', ()=>{
        allItems[+cb.dataset.i].excluded = !cb.checked;
        renderPreview();
      });
    });

    if (allNotesRaw.length){
      notesList.innerHTML = allNotesRaw.map((n,ni)=>`
        <li style="margin-bottom:6px;">
          ${escapeHtml(n)}
          <div class="row" style="margin-top:4px;">
            <button class="secondary tiny" data-act="copy" data-ni="${ni}" type="button">コピーする</button>
            <button class="secondary tiny" data-act="cat" data-ni="${ni}" type="button">カテゴリーにする</button>
            <button class="secondary tiny" data-act="del" data-ni="${ni}" type="button">削除する</button>
          </div>
        </li>
      `).join('');
      notesBox.classList.add('show');
      notesList.querySelectorAll('button').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const ni = +btn.dataset.ni, act = btn.dataset.act;
          const note = allNotesRaw[ni];
          if (act === 'copy'){
            const original = btn.textContent;
            const showDone = ()=>{ btn.textContent = 'コピーしました'; setTimeout(()=>{ btn.textContent = original; }, 1500); };
            navigator.clipboard.writeText(note).then(showDone).catch(()=>{
              const ta = document.createElement('textarea');
              ta.value = note;
              document.body.appendChild(ta);
              ta.select();
              document.execCommand('copy');
              document.body.removeChild(ta);
              showDone();
            });
            return;
          }
          if (act === 'cat'){
            const { name, emoji } = extractCategoryInfoFromLine(note);
            if (name && !categories.some(c=>c.name===name)){
              insertNewCategory(name, emoji);
              renderCatPanel();
              renderSubnotePanel();
            }
          }
          allNotesRaw.splice(ni, 1);
          renderPreview();
        });
      });
    } else {
      notesBox.classList.remove('show');
      notesList.innerHTML = '';
    }

    previewCard.style.display = 'block';
    markupCard.style.display = 'block';
    refreshOutputIfVisible();
  }

  // ---- 新カテゴリー検出の確認UI ----
  // 検出した新カテゴリーはその場で自動的に使用する（保存の要否を尋ねない）。
  // 誤検出だった場合のみ「カテゴリーではない」で取り消せるようにする。
  function renderNewCatDetections(){
    newCatList.innerHTML = '';
    if (pendingCategoryDetections.length === 0){
      newCatBox.classList.remove('show');
      return;
    }
    newCatBox.classList.add('show');
    newCatList.innerHTML = pendingCategoryDetections.map((det,i)=>`
      <li style="margin-bottom:8px;">
        「${escapeHtml(det.name)}」を新しいカテゴリーとして自動的に使用しています。
        <div class="row" style="margin-top:4px;">
          <button class="secondary tiny" data-act="reject" data-i="${i}" type="button">カテゴリーではない（取り消す）</button>
        </div>
      </li>
    `).join('');
    newCatList.querySelectorAll('button').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const i = +btn.dataset.i;
        const det = pendingCategoryDetections[i];
        // カテゴリーではない → 各品目を通常のカテゴリ判定に戻す
        allItems.forEach(it=>{
          if (it.newCategoryPending === det.name){
            const cat = suggestCategory(it.tag, it.name);
            it.dai = cat.dai; it.naka = cat.naka;
            delete it.newCategoryPending;
          }
        });
        // 自動追加していたカテゴリーを、他で使われていなければ取り除く
        const stillUsed = allItems.some(it=>it.dai===det.name) || subnotes.some(sn=>sn.dai===det.name);
        if (!stillUsed) categories = categories.filter(c=>c.name!==det.name);
        pendingCategoryDetections.splice(i, 1);
        renderNewCatDetections();
        renderCatPanel();
        renderSubnotePanel();
        renderPreview();
        refreshOutputIfVisible();
      });
    });
  }

  // 一度お客様向けテキストが表示された後は、品目編集のたびに自動で再生成する
  function refreshOutputIfVisible(){

  function doParse(){
    const text = pasteArea.value;
    if (!text.trim()){ alert('貼り付けるデータがありません。'); return; }
    const {grid, blocks} = parseGrid(text);
    const res = extractItemsFromGrid(grid, blocks);
    allItems = res.items;
    allNotesRaw = res.notes;
    allPartNotes = res.partNotes;
    // 同名の候補は1件にまとめ、その場で自動的にカテゴリーとして使用する
    pendingCategoryDetections = [];
    const seenCatNames = new Set();
    res.categoryCandidates.forEach(c=>{
      if (!seenCatNames.has(c.name)){
        seenCatNames.add(c.name);
        pendingCategoryDetections.push({name:c.name});
        if (!categories.some(cc=>cc.name===c.name)) insertNewCategory(c.name, c.emoji);
      }
    });

    renderCatPanel();
    renderSubnotePanel();
    renderNewCatDetections();
    renderPreview();
    outputCard.style.display = 'none';
  }

  calcBtn.addEventListener('click', ()=>{
    const threshold = parseFloat(thresholdInput.value) || 0;
    const lowMult = parseFloat(lowMultInput.value) || 1;
    const highMult = parseFloat(highMultInput.value) || 1;
    const unit = parseInt(roundSelect.value, 10) || 1;
    allItems.forEach(it=>{
      if (it.price.value != null){
        const mult = it.price.value < threshold ? lowMult : highMult;
        const raw = it.price.value * mult;
        const clean = Math.round(raw * 1e6) / 1e6; // 浮動小数点誤差を除去
        it.price.newValue = Math.ceil(clean / unit) * unit;
      } else {
        it.price.newValue = null;
      }
    });
    renderPreview();
    outputCard.style.display = 'block';
    genOutput();
  });

  function formatPrice(p){
    const val = (p.newValue!=null) ? p.newValue : p.value;
    if (p.type==='k') return 'k' + val.toLocaleString('ja-JP');
    if (p.type==='yen') return '¥' + val.toLocaleString('ja-JP');
    if (p.type==='ask') return '価格はお問合せください';
    if (p.type==='unknown') return '未定';
    return p.raw ? (p.raw + '（要確認）') : '不明';
  }

  function headerLine(cat){
    if (cat.style === 'bracket') return `【${cat.emoji}${cat.name}】`;
    // カテゴリー名の途中に【】が含まれる場合(新カテゴリー検出時の長い見出し等)は、
    // 見出しが長くなりすぎないよう【】部分を次の行に改行して記載する
    const idx = cat.name.indexOf('【');
    if (idx > 0){
      const before = cat.name.slice(0, idx).trim();
      const bracketPart = cat.name.slice(idx);
      return `ーー${cat.emoji}${before}ーー\n${bracketPart}`;
    }
    return `ーー${cat.emoji}${cat.name}ーー`;
  }

  function itemLines(it){
    const tagPart = it.tag ? `【${it.tag}】` : '';
    const originPart = it.origin ? `／${it.origin}` : '';
    const line1 = `🔸${tagPart}${it.name}${originPart}`;
    const priceStr = formatPrice(it.price);
    const lines = [line1];
    if (it.sizeMain){
      lines.push(`${it.sizeMain}　${priceStr}`);
      if (it.comment) lines.push(`→${it.comment}`);
    } else {
      lines.push(it.comment ? `${priceStr}→${it.comment}` : priceStr);
    }
    return lines;
  }

  // 「部位指定は～」等のメモに列挙されうる魚種名。原稿には毎回同じ文言で書かれているが、
  // その日実際には入荷が無い魚種の名前が残ってしまうことがあるため、実在チェックして取り除く
  const PART_NOTE_FISH_NAMES = ['カンパチ', 'ハマチ'];
  function formatPartNote(note, presentFishNames){
    let text = note;
    PART_NOTE_FISH_NAMES.forEach(name=>{
      if (!presentFishNames.has(name)){
        text = text.replace(new RegExp(`、${name}|${name}、`), '');
      }
    });
    // 「部位指定は～」の直前で改行する
    text = text.replace(/[ \t　]*部位指定/, '\n部位指定');
    return text;
  }

  function generateText(){
    const byDai = new Map();
    allItems.filter(it=>!it.excluded).forEach(it=>{
      if (!byDai.has(it.dai)) byDai.set(it.dai, new Map());
      const nakaMap = byDai.get(it.dai);
      const key = it.naka || '';
      if (!nakaMap.has(key)) nakaMap.set(key, []);
      nakaMap.get(key).push(it);
    });

    // その日のデータに実際に登場する魚種名（部位指定メモのプルーニング判定用）
    const presentFishNames = new Set(PART_NOTE_FISH_NAMES.filter(name=>
      allItems.some(it=>!it.excluded && it.name && it.name.includes(name))
    ));

    const blocks = [];
    const placedPartNotes = new Set(); // 同じメモを複数カテゴリーに重複掲載しないための記録
    categories.forEach(cat=>{
      const nakaMap = byDai.get(cat.name);
      if (!nakaMap || nakaMap.size===0) return;
      // 大カテゴリの見出しの下に、そのカテゴリ用に追加した文章をそのまま続ける
      const catNotes = subnotes.filter(sn=>sn.dai===cat.name && sn.note).map(sn=>sn.note);
      blocks.push({ lines:[headerLine(cat), ...catNotes], newCategory:true });

      // ナカの並び順: cat.nakaOrder があればそれを優先し、指定のないキーは元の順序のまま後ろに続ける
      let keys = Array.from(nakaMap.keys());
      if (cat.nakaOrder){
        const orderedKnown = cat.nakaOrder.filter(k=>nakaMap.has(k));
        const rest = keys.filter(k=>!cat.nakaOrder.includes(k));
        keys = [...orderedKnown, ...rest];
      }
      keys.forEach(key=>{
        const items = nakaMap.get(key);
        if (key){
          blocks.push({ lines:[`■${key}`], newCategory:false });
        }
        items.forEach(it=>{
          blocks.push({ lines: itemLines(it), newCategory:false });
        });
      });

      // 「部位指定は～」等のメモは、原文に登場する品目名がこのカテゴリーに含まれていれば
      // 文言を書き換えずそのままカテゴリー末尾に転記する（対象魚種は原稿によって変わるため）。
      // 同じメモの対象魚種が複数カテゴリーに分かれて載っていても、掲載は最初の1箇所だけにする
      const catItemNames = keys.flatMap(key=>nakaMap.get(key)).map(it=>it.name);
      allPartNotes.forEach(note=>{
        if (!placedPartNotes.has(note) && catItemNames.some(name => name && note.includes(name))){
          const formatted = formatPartNote(note, presentFishNames);
          blocks.push({ lines: formatted.split('\n'), newCategory:false });
          placedPartNotes.add(note);
        }
      });
    });

    let out = '';
    blocks.forEach((b, i)=>{
      if (i>0) out += b.newCategory ? '\n\n\n' : '\n\n';
      out += b.lines.join('\n');
    });
    return out;
  }

  const WEEKDAY_JA = ['日','月','火','水','木','金','土'];
  function buildIntroText(){
    const tomorrow = new Date();
    tomorrow.setDate(tomorrow.getDate() + 1);
    const m = tomorrow.getMonth() + 1;
    const d = tomorrow.getDate();
    const wd = WEEKDAY_JA[tomorrow.getDay()];
    return [
      '明日入荷のオススメ食材です‼️',
      '',
      '明日朝8:00までのご注文で',
      `${m}/${d}(${wd})当日配達可能です🚚`,
      '',
      `宅急便での翌日(${wd}曜日)着も可能📦`,
      '',
      '⚠️当日配達は都心のお客様限定',
      '　→送料1000円(税抜)',
    ].join('\n');
  }

  function genOutput(){
    const body = generateText();
    output.value = body ? `${buildIntroText()}\n\n\n${body}` : buildIntroText();
    resizeOutput();
  }

  // 生成されたテキストは中でスクロールさせず、全文が見えるようにテキストエリア自体を伸ばす（スクロールはページ全体で行う）
  function resizeOutput(){
    if (outputCard.style.display === 'none') return;
    if (!panelIsozaki.classList.contains('active')) return;

    output.style.height = output.scrollHeight + 'px';

  window.addEventListener('resize', resizeOutput);

  copyBtn.addEventListener('click', ()=>{

      copyOk.style.display = 'inline';

  renderCatPanel();
  renderSubnotePanel();

  // ---- タブ切り替え ----
  const tabBtnIsozaki = document.getElementById('tabBtnIsozaki');
  const tabBtnKadokura = document.getElementById('tabBtnKadokura');
  const panelIsozaki = document.getElementById('panel-isozaki');
  const panelKadokura = document.getElementById('panel-kadokura');

  function switchTab(tab){
    const isIso = tab === 'isozaki';
    tabBtnIsozaki.classList.toggle('active', isIso);
    tabBtnKadokura.classList.toggle('active', !isIso);

    else resizeOutput();
  }
  tabBtnIsozaki.addEventListener('click', ()=>switchTab('isozaki'));
  tabBtnKadokura.addEventListener('click', ()=>switchTab('kadokura'));

  // ---- 角倉案内タブ（ルールは追って設定。今は貼り付けたテキストをそのまま整形なしで表示） ----
  const pasteAreaK = document.getElementById('pasteAreaK');
  const genBtnK = document.getElementById('genBtnK');
  const clearBtnK = document.getElementById('clearBtnK');
  const outputCardK = document.getElementById('outputCardK');
  const outputK = document.getElementById('outputK');
  const copyBtnK = document.getElementById('copyBtnK');
  const copyOkK = document.getElementById('copyOkK');

  // ============================================================
  // 角倉案内 パーサー / フォーマッター
  // ============================================================
  const Kdk = (function(){
    function calcPrice(value, threshold=10000, lowMult=1.15, highMult=1.10, unit=100){
      const mult = value < threshold ? lowMult : highMult;
      const raw = value * mult;
      const clean = Math.round(raw * 1e6) / 1e6;
      return Math.ceil(clean / unit) * unit;
    }
    function fmtNum(n){ return n.toLocaleString('ja-JP'); }

    // ---------------- origin ----------------
    const PREFS = ['北海道','青森','岩手','宮城','秋田','山形','福島','茨城','栃木','群馬','埼玉','千葉','東京','神奈川',
      '新潟','富山','石川','福井','山梨','長野','岐阜','静岡','愛知','三重','滋賀','京都','大阪','兵庫','奈良','和歌山',
      '鳥取','島根','岡山','広島','山口','徳島','香川','愛媛','高知','福岡','佐賀','長崎','熊本','大分','宮崎','鹿児島','沖縄'];
    const FOREIGN = ['韓国','中国','ノルウェー','ロシア','ベトナム','チリ','アメリカ','台湾'];
    const ORIGIN_NAMES = [...PREFS, ...FOREIGN];

    function normalizePref(pref){
      // ORIGIN_NAMES の要素はすでに表示したい短い形（例:「京都」「兵庫」）そのものなので、
      // ここでは何も削らずそのまま返す（誤って「京都」→「京」のように壊さないため）。
      return pref;
    }

    // 名前に直接くっついた産地（例:「メックリアジ兵庫(二見)」「ウオゼ(シズ)三重安乗」）を分離する
    function extractNameAndOrigin(rawName){
      let s = rawName.trim();
      let bestIdx = -1, bestPref = '';
      for (const p of ORIGIN_NAMES){
        const idx = s.indexOf(p);
        if (idx !== -1 && (bestIdx === -1 || idx < bestIdx)) { bestIdx = idx; bestPref = p; }
      }
      if (bestIdx === -1) return { itemName: s, originDisplay: '', trailingNote: '', pref: '' };

      let left = s.slice(0, bestIdx).trim();
      let matchEnd = bestIdx + bestPref.length;
      // 「京都府」「東京都」のように短い形のすぐ後に行政区分の接尾語が続く場合はそれも読み飛ばす
      if (/^[都道府県]/.test(s.slice(matchEnd)) && !bestPref.endsWith(s[matchEnd])) matchEnd += 1;
      let rightFull = s.slice(matchEnd);
      let right = rightFull.trim();
      const hadSpaceBeforeRight = /^\s/.test(rightFull);

      // 名前側の末尾に付いた「(シズ)」のような括弧はナカグロで名前に統合
      let leftMerge = '';
      const leftParenMatch = left.match(/^(.*?)[（(]([^)）]+)[)）]\s*$/);
      if (leftParenMatch){
        left = leftParenMatch[1].trim();
        leftMerge = leftParenMatch[2].trim();
      }
      const itemName = leftMerge ? `${left}・${leftMerge}` : left;

      // 産地の直後にスペース無しで続く「(地名)」は産地の一部としてナカグロ連結
      let place = '';
      let trailingNote = '';
      if (!hadSpaceBeforeRight){
        let m;
        while ((m = right.match(/^[（(]([^)）]+)[)）]/))){
          place = place ? `${place}・${m[1].trim()}` : m[1].trim();
          right = right.slice(m[0].length).trim();
        }
      }
      if (!place){
        const noteMatch = right.match(/^[（(]([^)）]+)[)）]$/);
        if (noteMatch){
          trailingNote = noteMatch[1].trim();
          right = '';
        } else {
          place = right.replace(/[,、]/g,'').trim();
        }
      }
      const pref = normalizePref(bestPref);
      const originDisplay = place ? `(${pref}・${place})` : `(${pref})`;
      return { itemName, originDisplay, trailingNote, pref };
    }

    // 名前とは別行になっている産地行（例:「北海道,仙鳳趾（大粒）」「兵庫室津港 津田宇」「（京都府,宮津）」）を解析する
    function parseOriginLine(originLine){
      let s = (originLine || '').trim();
      // 行全体が一つの括弧で丸ごと囲まれている場合は外側の括弧だけ剥がす
      const wholeWrap = s.match(/^[（(](.+)[)）]$/);
      if (wholeWrap) s = wholeWrap[1].trim();

      let bestIdx = -1, bestPref = '';
      for (const p of ORIGIN_NAMES){
        const idx = s.indexOf(p);
        if (idx !== -1 && (bestIdx === -1 || idx < bestIdx)) { bestIdx = idx; bestPref = p; }
      }
      if (bestIdx === -1) return { originDisplay: '', trailingNote: '', pref: '' };

      const pref = normalizePref(bestPref);
      let matchEnd = bestIdx + bestPref.length;
      // 「京都府」のように短い形のすぐ後に行政区分の接尾語が続く場合はそれも読み飛ばす
      if (/^[都道府県]/.test(s.slice(matchEnd)) && !bestPref.endsWith(s[matchEnd])) matchEnd += 1;
      let rest = s.slice(matchEnd).trim();
      rest = rest.replace(/^[,、]\s*/, '');

      let place = '', trailingNote = '';
      const trailParen = rest.match(/^(.*?)[（(]([^)）]+)[)）]\s*$/);
      if (trailParen && trailParen[1].trim()){
        place = trailParen[1].trim();
        trailingNote = trailParen[2].trim();
      } else if (rest.includes(' ')){
        const idx = rest.indexOf(' ');
        place = rest.slice(0, idx).trim();
        trailingNote = rest.slice(idx+1).trim();
      } else {
        place = rest;
      }
      const originDisplay = place ? `(${pref}・${place})` : `(${pref})`;
      return { originDisplay, trailingNote, pref };
    }

    // ---------------- name normalization ----------------
    function normalizeName(name){
      return name
        .replace(/活天タイ/g, '活天然タイ')
        .replace(/天ヒラメ/g, '天然ヒラメ');
    }

    // ---------------- category classification ----------------
    const ASAJIME_SPECIES = ['ハモ','メイタカレイ','天然ヒラメ','オコゼ','活天然タイ','アコウ','活イシダイ'];
    const CATEGORY_ORDER = ['朝締め','ウニ','甲殻類・貝','青物・大衆魚','季節魚・回遊魚','高級魚・白身','細物','イカ','白子・内臓','加工品'];
    const CATEGORY_EMOJI = {
      '朝締め':'✨','ウニ':'💥','甲殻類・貝':'🦪','貝':'🦪',
      '青物・大衆魚':'🐟','季節魚・回遊魚':'🐡','高級魚・白身':'🐠','細物':'',
      'イカ':'🦑','白子・内臓':'','加工品':''
    };

    // 季節によって入荷する魚が変わるため、キーワードで大まかに判断する
    function baseClassify(name){
      const n = normalizeName(name);
      if (/ちりめん|しらす/.test(n)) return '加工品';
      if (/イカ/.test(n)) return 'イカ';
      if (/ガニ|カニ/.test(n)) return '甲殻類';
      if (/ガキ|オイスター|トリ貝|牡蠣/.test(n)) return '貝';
      // 青物・大衆魚：アジ類・イワシ類・サバ類など日常的で手頃な魚
      if (/アジ|イワシ|サバ/.test(n)) return '青物・大衆魚';
      // 季節魚・回遊魚：カツオ類（ガツオ）・マグロ幼魚・サワラ・サゴシ・ブリ系・シイラなど季節性の強い回遊魚
      if (/カツオ|ガツオ|ヨコワ|マグロ|サワラ|サゴシ|ブリ|ハマチ|メジロ|ワラサ|カンパチ|シイラ|サンマ/.test(n)) return '季節魚・回遊魚';
      // 高級魚・白身：キンキ・メヌケ・ギンダラ・キンメ・アマダイ・ムツ類・ノドグロ・クエ・ハタ類・ヒラメ・カレイ類など
      if (/キンキ|メヌケ|ギンダラ|キンメ|アマダイ|甘鯛|ムツ|ノドグロ|クエ|ハタ|ヒラメ|カレイ|オコゼ|イシダイ|アコウ/.test(n)) return '高級魚・白身';
      // 細物：キス・イサキ・カマス・太刀魚・穴子・ウオゼ（シズ）・サヨリ・メゴチ・ハゼなど小型・細長い魚
      if (/キス|イサキ|カマス|太刀魚|タチウオ|穴子|アナゴ|ウオゼ|シズ|サヨリ|メゴチ|ハゼ/.test(n)) return '細物';
      if (/白子|内臓|エンガワ/.test(n)) return '白子・内臓';
      // 上記に当てはまらない白身魚は「高級魚・白身」に分類する
      return '高級魚・白身';
    }
    function isAsajime(name, originPref, explicitMarker){
      if (explicitMarker) return true;
      const n = normalizeName(name);
      // ハモは産地に関わらず常に朝締め扱い
      if (n.includes('ハモ')) return true;
      // 「活天然タイSP」のようにグレード等が付いても species 名を含んでいれば対象にする
      if (originPref === '兵庫' && ASAJIME_SPECIES.some(sp => n.includes(sp))) return true;
      return false;
    }

    // ---------------- unit-suffix ----------------
    // 「1尾〜」「1杯〜」「1〜」のような単位＋〜は基本的に削除するが、「片身〜」だけは残す
    const UNIT_TAIL_RE = /(\s*\d*(尾|杯|枚|ケ|ヶ|P|個)?\s*〜)\s*$/;
    function stripUnitTail(s, keepAll){
      if (keepAll) return { text: s, removed: '' };
      if (/片身\s*〜\s*$/.test(s)) return { text: s, removed: '' };
      const m = s.match(UNIT_TAIL_RE);
      if (m && m[0].trim()) return { text: s.slice(0, m.index).trim(), removed: m[0].trim() };
      return { text: s, removed: '' };
    }

    // 1つのバリアント行（サイズ＋価格）をパースする
    function parseVariantLine(raw, opts){
      opts = opts || {};
      let s = raw.trim();

      // 背/腹の2価格パターン
      let m = s.match(/^(.*?)\s*背k([\d,]+)\s*腹k([\d,]+)\s*(.*)$/);
      if (m){
        const before = m[1].trim();
        const v1 = calcPrice(parseInt(m[2].replace(/,/g,''),10), opts.threshold, opts.lowMult, opts.highMult, opts.unit);
        const v2 = calcPrice(parseInt(m[3].replace(/,/g,''),10), opts.threshold, opts.lowMult, opts.highMult, opts.unit);
        const { text: tail } = stripUnitTail(m[4].trim(), opts.keepUnitTail);
        return { sizeText: before, priceStr: `背k${fmtNum(v1)}  腹k${fmtNum(v2)}`, tail, priceOk:true };
      }

      // k / ¥ プレフィックス価格（「1k×1P」のように単位としての「k」が先に出てくることがあるので、
      // ×プレフィックス判定より先に試す。「k」の直後が数字でなければここではマッチしない）
      m = s.match(/^(.*?)\s*([¥￥]|k)\s?([\d,]+)\s*(.*)$/i);
      if (m){
        const before = m[1].trim();
        const symbol = /k/i.test(m[2]) ? 'k' : '¥';
        const val = parseInt(m[3].replace(/,/g,''),10);
        const { text: tail } = stripUnitTail(m[4].trim(), opts.keepUnitTail);
        const newVal = calcPrice(val, opts.threshold, opts.lowMult, opts.highMult, opts.unit);
        return { sizeText: before, priceStr: symbol + fmtNum(newVal), tail, priceOk:true };
      }

      // ×プレフィックス価格（既に×表記の場合。加工品や宮津トリ貝の変換後などで使用）
      m = s.match(/^(.*×\s*)([\d,]+)(.*)$/);
      if (m){
        const before = m[1].replace(/×\s*$/,'').trim();
        const val = parseInt(m[2].replace(/,/g,''),10);
        const { text: tail } = stripUnitTail(m[3].trim(), opts.keepUnitTail);
        const newVal = calcPrice(val, opts.threshold, opts.lowMult, opts.highMult, opts.unit);
        return { sizeText: before, priceStr: `×${fmtNum(newVal)}`, tail, priceOk:true };
      }

      // 数量単位に数字が直接くっついた価格（1枚14,000 / 1ケ850 / 1玉250 / 1尾1,250 / 1P 4,200 のように間に空白がある場合も許容）
      m = s.match(/^(.*?)(\d*(?:枚|ケ|ヶ|玉|尾|P|個))\s*([\d,]+)\s*(.*)$/);
      if (m){
        const before = m[1].trim();
        const unitTok = m[2].replace(/ケ/, 'ヶ');
        const val = parseInt(m[3].replace(/,/g,''),10);
        const { text: tail } = stripUnitTail(m[4].trim(), opts.keepUnitTail);
        const newVal = calcPrice(val, opts.threshold, opts.lowMult, opts.highMult, opts.unit);
        return { sizeText: before, priceStr: `${unitTok}×${fmtNum(newVal)}`, tail, priceOk:true };
      }

      // 「k」等のプレフィックスが無い裸の数字も価格として扱う（金額自体は合っている前提で進める）
      m = s.match(/^(.*?)\s+([\d,]+)\s*(.*)$/);
      if (m && /\d/.test(m[2])){
        const before = m[1].trim();
        const val = parseInt(m[2].replace(/,/g,''),10);
        const { text: tail } = stripUnitTail(m[3].trim(), opts.keepUnitTail);
        const newVal = calcPrice(val, opts.threshold, opts.lowMult, opts.highMult, opts.unit);
        return { sizeText: before, priceStr: 'k' + fmtNum(newVal), tail, priceOk:true };
      }

      return { sizeText: s, priceStr: '', tail: '', priceOk:false };
    }

    // ---------------- 行のグルーピング ----------------
    function groupLines(rawText){
      const lines = rawText.replace(/\r\n/g,'\n').split('\n').map(l=>l.trim()).filter(l=>l.length>0);
      const groups = [];
      let current = null;
      let inKakouhin = false;

      function startGroup(name){
        if (current) groups.push(current);
        current = { name, originLine:null, variants:[], notes:[], asaJimeMarker:false, subVariants:null, forcedCategory: inKakouhin ? '加工品' : null };
      }

      for (const line of lines){
        if (line === '兵庫淡路島'){ inKakouhin = true; continue; }

        // 宮津トリ貝の「・玉/代金NNNN」はサブバリアントの価格行。通常の「・品目」より先に判定する
        if (current && current.subVariants && /^[・･]?玉\/代金/.test(line)){
          const mm = line.match(/([\d,]+)\s*$/);
          if (mm) current.subVariants[current.subVariants.length-1].price = parseInt(mm[1].replace(/,/g,''),10);
          continue;
        }

        if (line.startsWith('・') || line.startsWith('･')){
          startGroup(line.slice(1));
          continue;
        }
        if (line.startsWith('宮津')){
          startGroup(line);
          continue;
        }
        if (!current) continue;

        if (line.startsWith('↑')){
          if (line.includes('朝締め')) current.asaJimeMarker = true;
          else {
            const mm = line.match(/(\d+)/);
            if (mm && current.variants.length>0) current.variants[current.variants.length-1].qty = mm[1];
          }
          continue;
        }
        if (line.startsWith('※')){ current.notes.push(line); continue; }

        // 「→次回木曜日着」のような矢印の注記は、直前のバリアント（品目）にぶら下げる
        if (line.startsWith('→') && current.variants.length>0){
          current.variants[current.variants.length-1].arrowNote = line;
          continue;
        }

        if (line.startsWith('◎')){
          if (!current.subVariants) current.subVariants = [];
          const mm = line.match(/^◎(\S+?)-(.+)$/);
          current.subVariants.push({ label: mm ? mm[1] : line, size: mm ? mm[2] : '', price: null });
          continue;
        }

        // 行全体がカッコだけ、かつ数字を含まない場合のみ「単独の注記」として直前バリアントに付与
        if (/^[（(][^)）]*[)）]$/.test(line) && !/^\(SP\)$|^\(上\)$/.test(line) && current.variants.length>0){
          current.variants[current.variants.length-1].extraNote = line.replace(/[()（）]/g,'');
          continue;
        }

        if (current.variants.length===0 && current.originLine===null && current.subVariants===null && !/\d/.test(line)){
          current.originLine = line;
          continue;
        }

        current.variants.push({ raw: line, qty:null, extraNote:null });
      }
      if (current) groups.push(current);
      return groups;
    }

    return {
      calcPrice, fmtNum, extractNameAndOrigin, parseOriginLine, normalizeName, baseClassify, isAsajime,
      parseVariantLine, groupLines, stripUnitTail, ASAJIME_SPECIES, CATEGORY_ORDER, CATEGORY_EMOJI
    };
  })();

  const KdkBuild = (function(K){
    const PRICE_OPTS = { threshold: 10000, lowMult: 1.15, highMult: 1.10, unit: 100 };
    function fmtYen(n){ return n.toLocaleString('ja-JP'); }

    function resolveNameOrigin(group){
      if (group.originLine){
        const { itemName } = K.extractNameAndOrigin(group.name);
        const { originDisplay, trailingNote, pref } = K.parseOriginLine(group.originLine);
        return { itemName, originDisplay, trailingNote, pref };
      }
      return K.extractNameAndOrigin(group.name);
    }

    // 由良ウニは、原稿にその日の情報が無くても必ずこの5種を記載する
    const YURA_BRANDS = [
      { grade:'SP', name:'廣田丸' },
      { grade:'SP', name:'与助' },
      { grade:'SP', name:'山口水産' },
      { grade:'上', name:'山由丸' },
      { grade:'上', name:'秋山丸' },
    ];

    function buildYuraItem(brand, v, opts){
      const qtyPart = (v && v.qty) ? `→ ${v.qty}枚あり` : '';
      const lines = [` ○ ${brand.grade} ) ${brand.name}${qtyPart}`];
      if (!v) return lines; // 原稿にその日の記載が無い場合は名前だけ

      let rest = v.raw;
      if (brand.grade === 'SP' && rest.startsWith('SP')) rest = rest.slice(2);
      else if (brand.grade === '上' && rest.startsWith('上')) rest = rest.slice(1).trim();

      // 「SP与助  →次回木曜日着」のように同じ行内に埋め込まれた矢印の注記を切り出す
      let inlineArrowNote = '';
      const arrowIdx = rest.indexOf('→');
      if (arrowIdx !== -1){
        inlineArrowNote = rest.slice(arrowIdx).trim();
        rest = rest.slice(0, arrowIdx).trim();
      }

      const m = rest.match(/^(\D+?)(\d\S*)\s*1枚([\d,]+)/);
      if (m){
        let size = m[2].trim().replace(/前後$/, '').replace(/-/g, '〜');
        const price = K.calcPrice(parseInt(m[3].replace(/,/g,''),10), opts.threshold, opts.lowMult, opts.highMult, opts.unit);
        lines.push(`${fmtYen(price)}円/枚(約${size})`);
      }
      // 「→次回木曜日着」のような矢印の注記は、価格の有無・同じ行か別行かに関わらず必ず次の行に記載する
      const arrowNote = inlineArrowNote || v.arrowNote;
      if (arrowNote) lines.push(arrowNote);
      return lines;
    }

    function buildRegularUniItem(v, letter, opts){
      const m = v.raw.match(/(\d+g)(SP)?\s*1枚([\d,]+)/);
      if (!m) return null;
      const namePart = v.raw.slice(0, m.index).trim();
      const size = m[1];
      const grade = m[2] || '';
      const price = K.calcPrice(parseInt(m[3].replace(/,/g,''),10), opts.threshold, opts.lowMult, opts.highMult, opts.unit);
      const qtyLine = v.qty ? [`→${v.qty}枚あり`] : [];
      return [
        `🔸${letter})${namePart}ウニ${grade}`,
        `${size} - ${fmtYen(price)}円/枚`,
        ...qtyLine,
      ];
    }

    function buildItemLines(group, opts){
      const { itemName: rawItemName, originDisplay, trailingNote } = resolveNameOrigin(group);
      const itemName = K.normalizeName(rawItemName);

      const parsed = group.variants.map(v => K.parseVariantLine(v.raw, opts));

      // 全バリアントが同じ「(先頭カッコ)」を共有していたら見出し行へ引き上げる
      let hoisted = '';
      if (parsed.length > 1 && parsed.every(p => p.priceOk)){
        const prefixes = parsed.map(p => {
          const m = p.sizeText.match(/^[（(]([^)）]+)[)）]\s*/);
          return m ? m[1] : null;
        });
        if (prefixes.every(p => p && p === prefixes[0])){
          hoisted = prefixes[0];
          parsed.forEach(p => { p.sizeText = p.sizeText.replace(/^[（(][^)）]+[)）]\s*/, ''); });
        }
      }

      // 括弧なしで先頭に付く「SP」は「(上)」等と表記を揃えるため「(SP)」にする
      parsed.forEach(p => {
        if (/^SP\S/.test(p.sizeText)) p.sizeText = '(SP)' + p.sizeText.slice(2);
      });

      const lines = [];
      // 魚種名が10文字以上の場合は、産地を改行して次の行に表記する（値段はその次でもともと改行済み）
      if (itemName.length >= 10){
        lines.push(`🔸${itemName}`);
        let originLine = '';
        if (originDisplay) originLine += originDisplay;
        if (trailingNote) originLine += ` ${trailingNote}`;
        if (hoisted) originLine += ` ${hoisted}`;
        originLine = originLine.trim();
        if (originLine) lines.push(originLine);
      } else {
        let header = `🔸${itemName}`;
        if (originDisplay) header += originDisplay;
        if (trailingNote) header += ` ${trailingNote}`;
        if (hoisted) header += ` ${hoisted}`;
        lines.push(header);
      }

      if (parsed.length === 0 && group.originLine === '入荷無し'){ lines.push('入荷無し'); return lines; }

      parsed.forEach((p, i) => {
        let line;
        if (!p.priceOk){
          // 価格として認識できなかった行は、勝手に計算せずそのまま出して要確認フラグを立てる
          line = `${group.variants[i].raw} ⚠️要確認`;
        } else {
          line = `${p.sizeText} ${p.priceStr}`;
          if (p.tail) line += `  ${p.tail}`;
          if (group.variants[i].extraNote) line += ` (${group.variants[i].extraNote})`;
        }
        lines.push(line);
        if (group.variants[i].qty) lines.push(`→${group.variants[i].qty}枚あり`);
      });
      group.notes.forEach(n => lines.push(n));
      return lines;
    }

    function findFirstDigit(s){ const m = s.match(/\d/); return m ? m.index : s.length; }

    function process(rawText, opts){
      opts = opts || PRICE_OPTS;
      const groups = K.groupLines(rawText);

      const yuraLines = [];
      const uniRegularItems = [];
      const categoryItems = {};
      const kakouhinRaw = [];

      groups.forEach(group => {
        // 入荷無し：丸ごと省く
        if (group.originLine === '入荷無し') return;

        // 入荷未定：originLine にその文言が入ってくる特殊ケース
        if (group.originLine === '入荷未定'){
          const { itemName, originDisplay } = K.extractNameAndOrigin(group.name);
          const nm = K.normalizeName(itemName);
          const asaJime = K.isAsajime(nm, (K.extractNameAndOrigin(group.name).pref||''), group.asaJimeMarker);
          const cat = asaJime ? '朝締め' : K.baseClassify(nm);
          const lines = [`🔸${nm}${originDisplay}`, group.originLine];
          (categoryItems[cat] = categoryItems[cat]||[]).push({ lines, isKani:false });
          return;
        }

        if (group.name === 'ウニ'){
          const { originDisplay: yuraOrigin } = K.parseOriginLine(group.originLine || '');
          const yuraVariants = group.variants.filter(v => /^SP/.test(v.raw) || /^上\s?/.test(v.raw));
          const regularVariants = group.variants.filter(v => !yuraVariants.includes(v));

          // 由良ウニのセクションは「・ウニ」の記載が原稿にあれば必ず出す。
          // 5銘柄は、その日の情報（価格など）が原稿に無くても名前だけは必ず記載する。
          yuraLines.push(`⭐️由良ウニ${yuraOrigin}`);
          YURA_BRANDS.forEach((brand, i) => {
            const v = yuraVariants.find(vv => vv.raw.includes(brand.name));
            const built = buildYuraItem(brand, v, opts);
            yuraLines.push(...built);
            if (i < YURA_BRANDS.length - 1) yuraLines.push('');
          });

          const letters = ['A','B','C','D','E','F'];
          regularVariants.forEach((v,i) => {
            const built = buildRegularUniItem(v, letters[i], opts);
            if (built) uniRegularItems.push(built);
          });
          return;
        }

        if (group.forcedCategory === '加工品'){
          kakouhinRaw.push(group);
          return;
        }

        if (group.subVariants){
          const { itemName, originDisplay } = resolveNameOrigin(group);
          const lines = [`🔸${K.normalizeName(itemName)}${originDisplay}`];
          group.subVariants.forEach(sv => {
            const price = K.calcPrice(sv.price, opts.threshold, opts.lowMult, opts.highMult, opts.unit);
            lines.push(`◎${sv.label} ${sv.size} 1玉×${fmtYen(price)}`);
          });
          const cat = K.baseClassify(itemName);
          (categoryItems[cat] = categoryItems[cat]||[]).push({ lines, isKani:false });
          return;
        }

        const { itemName, pref } = resolveNameOrigin(group);
        const nm = K.normalizeName(itemName);
        const asaJime = K.isAsajime(nm, pref, group.asaJimeMarker);
        const cat = asaJime ? '朝締め' : K.baseClassify(nm);
        const lines = buildItemLines(group, { ...opts, keepUnitTail: cat === '加工品' });
        const isKani = /ガニ|カニ/.test(group.name);
        (categoryItems[cat] = categoryItems[cat]||[]).push({ lines, isKani });
      });

      // 加工品: 同じ価格の連続商品はまとめる
      const kakouhinItems = [];
      {
        let i = 0;
        while (i < kakouhinRaw.length){
          const group = kakouhinRaw[i];
          const fd = findFirstDigit(group.name);
          const parsed = K.parseVariantLine(group.name.slice(fd), { ...opts, keepUnitTail:true });
          const nameOnly = group.name.slice(0, fd).trim();
          let j = i+1;
          const names = [nameOnly];
          while (j < kakouhinRaw.length){
            const g2 = kakouhinRaw[j];
            const fd2 = findFirstDigit(g2.name);
            const p2 = K.parseVariantLine(g2.name.slice(fd2), { ...opts, keepUnitTail:true });
            if (p2.priceStr === parsed.priceStr && p2.sizeText === parsed.sizeText && p2.tail === parsed.tail){
              names.push(g2.name.slice(0, fd2).trim());
              j++;
            } else break;
          }
          const nameLines = names.map((n,idx) => {
            const prefix = idx === 0 ? '🔸' : '';
            const suffix = idx < names.length-1 ? '／' : '';
            return `${prefix}${n}${suffix}`;
          });
          let priceLine = `${parsed.sizeText} ${parsed.priceStr}`;
          if (parsed.tail) priceLine += `  ${parsed.tail}`;
          kakouhinItems.push({ lines: [...nameLines, priceLine] });
          i = j;
        }
      }

      return { yuraLines, uniRegularItems, categoryItems, kakouhinItems };
    }

    // 「アジ」を含む品目を、元の並び順を保ったまま一箇所にまとめる（場所・順番自体は問わない）
    function groupAjiTogether(items){
      const isAji = it => /アジ/.test(it.lines[0]);
      const firstAjiIdx = items.findIndex(isAji);
      if (firstAjiIdx === -1) return items;
      const ajiItems = items.filter(isAji);
      const others = items.filter(it => !isAji(it));
      let othersBeforeCount = 0;
      for (let i=0; i<firstAjiIdx; i++){ if (!isAji(items[i])) othersBeforeCount++; }
      return [...others.slice(0, othersBeforeCount), ...ajiItems, ...others.slice(othersBeforeCount)];
    }

    function weekdayJa(d){ return ['日','月','火','水','木','金','土'][d.getDay()]; }

    function buildFullOutput(rawText, opts){
      opts = opts || PRICE_OPTS;
      const { yuraLines, uniRegularItems, categoryItems, kakouhinItems } = process(rawText, opts);

      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate()+1);
      const header = `【${tomorrow.getMonth()+1}/${tomorrow.getDate()}(${weekdayJa(tomorrow)})入荷】鮮魚案内🐟✨\n_______________________`;

      const footer = [
        '────────────','',
        '【 📋 ご注文について 】','',
        '🕐 今晩中のご注文','　→ 航空便にて翌日15時頃お届け','　※都心店舗限定','　　（送料約2,500〜3,000円）','',
        '🚛 宅急便翌日発送も対応可','',
        '⚠️ 処理指定はご注文時にお知らせください','⚠️ 発注は必ずグループLINEへ','',
        '────────────','',
        'ご検討のほど、よろしくお願いいたします🌀',
      ].join('\n');

      const parts = [];
      parts.push(header);
      if (yuraLines.length){
        parts.push(`【🌊由良ウニ解禁🌊】\n\n${yuraLines.join('\n')}`);
        parts.push('────────────');
      }

      const catBlocks = [];
      const asaJimeItems = categoryItems['朝締め'] || [];
      if (asaJimeItems.length){
        catBlocks.push(`【朝締め${K.CATEGORY_EMOJI['朝締め']}】\n\n` + asaJimeItems.map(it=>it.lines.join('\n')).join('\n\n'));
      }
      if (uniRegularItems.length){
        catBlocks.push(`【ウニ${K.CATEGORY_EMOJI['ウニ']}】\n\n` + uniRegularItems.map(l=>l.join('\n')).join('\n\n'));
      }
      const kaniKai = (categoryItems['甲殻類']||[]).concat(categoryItems['貝']||[]);
      if (kaniKai.length){
        const hasKani = kaniKai.some(it=>it.isKani);
        const label = hasKani ? '甲殻類・貝' : '貝';
        catBlocks.push(`【${label}${K.CATEGORY_EMOJI[label]}】\n\n` + kaniKai.map(it=>it.lines.join('\n')).join('\n\n'));
      }
      ['青物・大衆魚','季節魚・回遊魚','高級魚・白身','細物','イカ','白子・内臓'].forEach(cat=>{
        let items = categoryItems[cat] || [];
        if (cat === '青物・大衆魚') items = groupAjiTogether(items);
        if (items.length) catBlocks.push(`【${cat}${K.CATEGORY_EMOJI[cat]}】\n\n` + items.map(it=>it.lines.join('\n')).join('\n\n'));
      });
      if (kakouhinItems.length){
        catBlocks.push(`【加工品】\n※兵庫県、淡路島より\n\n` + kakouhinItems.map(it=>it.lines.join('\n')).join('\n\n'));
      }

      parts.push(catBlocks.join('\n\n_ _ _ _ _ _ _ _ _ _ _ _ _ _\n\n'));
      parts.push(footer);

      return parts.join('\n\n');
    }

    return { process, buildFullOutput };
  })(Kdk);

  function processKadokuraText(raw){
    return KdkBuild.buildFullOutput(raw);
  }

  // 変換後のテキストは中でスクロールさせず、全文が見えるようにテキストエリア自体を伸ばす（スクロールはページ全体で行う）
  function resizeOutputK(){
    if (outputCardK.style.display === 'none') return;
    if (!panelKadokura.classList.contains('active')) return;
    outputK.style.height = 'auto';
    outputK.style.height = outputK.scrollHeight + 'px';
  }
  window.addEventListener('resize', resizeOutputK);

  genBtnK.addEventListener('click', ()=>{
    const raw = pasteAreaK.value;
    if (!raw.trim()){ alert('貼り付けるテキストがありません。'); return; }
    outputK.value = processKadokuraText(raw);
    outputCardK.style.display = 'block';
    resizeOutputK();
  });

  clearBtnK.addEventListener('click', ()=>{
    pasteAreaK.value = '';
    outputK.value = '';
    outputCardK.style.display = 'none';
  });

  copyBtnK.addEventListener('click', ()=>{
    outputK.select();
    navigator.clipboard.writeText(outputK.value).then(()=>{
      copyOkK.style.display = 'inline';
      setTimeout(()=>{ copyOkK.style.display = 'none'; }, 1800);
    }).catch(()=>{
      document.execCommand('copy');
      copyOkK.style.display = 'inline';
      setTimeout(()=>{ copyOkK.style.display = 'none'; }, 1800);
    });
  });
})();
</script>
